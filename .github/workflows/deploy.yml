name: Deploy Onyu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: cafe-brand/package-lock.json

      - name: Install
        run: npm ci
        working-directory: cafe-brand

      - name: Build
        run: npm run build
        working-directory: cafe-brand

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: cafe-brand/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
